# bandersnatch.conf — PyPI mirror config for DeerFlow offline development
#
# Derived from the union of:
#   backend/pyproject.toml          (deer-flow application)
#   backend/packages/harness/pyproject.toml  (deerflow-harness framework)
# Including all optional-extras and dev dependencies.
#
# Usage:
#   bandersnatch mirror -c tutorial/bandersnatch.conf
#
# The [allowlist] below lists every direct dependency declared in the project.
# Bandersnatch resolves and mirrors transitive dependencies automatically.
# To keep the mirror lean, only needle packages are allowlisted; no blanket
# mirror.  When using allowlist mode it is critical that ALL transitives
# resolve during sync — run `bandersnatch mirror` in a connected environment
# first, then copy the mirror to the air-gapped target.
#
# If you prefer a "mirror everything" approach, comment out [allowlist] and
# uncomment the [blacklist] section instead.

[mirror]
directory = /srv/pypi-mirror
master = https://pypi.org

# Proxy for environments behind a corporate gateway
;proxy = http://proxy.example.com:8080

# Worker threads — bump on fast links, dial back on constrained bandwidth
workers = 8

# Hash-check all downloaded files
verify = true

# Discard packages whose hash doesn't match
hash-index = true

# Generate PEP 503 "simple" repository index (required by pip --index-url)
simple-json = true

# ── Plugins ──────────────────────────────────────────────────────────
enabled-plugins =
    bandersnatch.filter_project_plugins_filters
    bandersnatch.filter_release_plugins_filters

# Filter out source-only releases if you only need wheels (faster sync)
;plugins =
;    bandersnatch.filter_release_plugins.ReleaseFilterPlugin
;release-filter = no_source_package

# ── Storage ──────────────────────────────────────────────────────────
# Leave defaults: flat-file tree under directory/
# For S3/GCS backends, add the storage plugin and config here.

# ── Allowlist — only the packages listed here (and their transitives) ──
#
# Organisation: groups separated by blank lines for readability.
# All packages are UNPINNED — keep in sync with the project's actual
# version constraints in the two pyproject.toml files.
